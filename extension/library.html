<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>X Kit · 本地素材库</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <div class="eyebrow">X KIT / LOCAL WORKSPACE</div>
          <h1>把看见的，变成用得上的。</h1>
          <p id="total"></p>
        </div>
        <div class="backup">
          <button id="backup">备份 JSON</button
          ><label class="import-label"
            >导入备份<input
              id="import"
              type="file"
              accept="application/json,.json"
          /></label>
        </div>
      </header>
      <nav role="tablist" aria-label="工具页面">
        <button role="tab" data-view="posts" aria-selected="true">素材库</button
        ><button role="tab" data-view="notes" aria-selected="false">
          账号备注</button
        ><button role="tab" data-view="rules" aria-selected="false">
          降噪规则
        </button>
      </nav>
      <div class="search">
        <input
          type="search"
          id="query"
          aria-label="搜索素材或备注"
          placeholder="搜索正文、作者、标签、自己的备注…"
        /><select id="category" aria-label="用途筛选">
          <option value="">全部用途</option>
        </select>
      </div>
      <p id="module-state"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="posts-view">
        <div class="section-head">
          <p>独立的本地收藏库，不同步或修改 X 书签。</p>
          <button id="export-filtered">导出当前筛选结果</button>
        </div>
        <div id="posts"></div>
      </section>
      <section id="notes-view" hidden><div id="notes"></div></section>
      <section id="rules-view" hidden>
        <h2>让信息流安静一点</h2>
        <p>
          每行一条，按文字直接匹配。匹配到的帖子会折叠，保留“本次展开”入口。白名单优先于其他规则。
        </p>
        <div class="rule-grid">
          <label
            >关键词<textarea
              id="keywords"
              maxlength="6000"
              placeholder="例如：互关\n每日抽奖"
            ></textarea></label
          ><label
            >折叠这些账号<textarea
              id="accounts"
              maxlength="6000"
              placeholder="每行一个 @用户名"
            ></textarea></label
          ><label
            >始终保留这些账号<textarea
              id="allow"
              maxlength="6000"
              placeholder="白名单，每行一个 @用户名"
            ></textarea>
          </label>
        </div>
        <button id="save-rules" class="primary">保存规则</button>
        <p>
          这里只改变本机显示，不会在 X 上拉黑、取关或发消息。每组最多使用前 100
          条规则。
        </p>
      </section>
      <footer>
        数据只在当前浏览器本地保存。卸载插件会清除本地数据，请先备份。导入仅添加新记录，已有记录不覆盖。
      </footer>
    </div>
    <dialog id="editor"></dialog>
    <script src="library.js"></script>
  </body>
</html>
